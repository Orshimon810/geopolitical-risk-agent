name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # -----------------------------------------------------------------------
  # Python: lint + type-check + unit tests
  # -----------------------------------------------------------------------
  python:
    name: Python (lint / typecheck / tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check src/ api/ --select E,F,W --ignore E501

      - name: Type-check (mypy)
        run: mypy src/georisk_agent --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # informational until type coverage improves

      - name: Run unit tests
        run: pytest tests/ -v
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
          DATABASE_URL: ""

  # -----------------------------------------------------------------------
  # Frontend: lint + build
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (lint / build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # -----------------------------------------------------------------------
  # Docker: smoke-build the API image (no push)
  # -----------------------------------------------------------------------
  docker:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    needs: python

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t georisk-api:ci .
