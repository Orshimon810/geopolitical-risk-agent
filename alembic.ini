# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Truncate slug to avoid overly long filenames
truncate_slug_length = 40

# Timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# sys.path to search for the environment module
prepend_sys_path = .

# version location specification
version_locations = %(here)s/alembic/versions

# The migration environment reads DATABASE_URL from the environment.
# Leave sqlalchemy.url blank here — it is set dynamically in env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
