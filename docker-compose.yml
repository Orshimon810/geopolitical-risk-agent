version: "3.9"

# Local development stack.
# Requires a .env file at the project root (copy from .env.example).
#
# Start everything:    docker compose up --build
# API only:            docker compose up api redis
# Rebuild after code changes: docker compose up --build api worker

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override Redis URLs to use the compose service name, not localhost
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: redis://redis:6379/1
      RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # --pool=solo is required on Windows (default prefork uses spawn which
    # conflicts with heavy async imports). On Linux/macOS use --pool=prefork.
    command: >
      celery -A api.worker.celery_app worker
      --loglevel=info
      --pool=solo
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: redis://redis:6379/1
      RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
