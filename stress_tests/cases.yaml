# Stress-test cases for the geopolitical risk agent.
#
# Fields:
#   id       — short label for the result
#   query    — the question to run
#   portfolio — list of holdings optional
#     each holding: ticker, name, asset_type stock|etf|crypto|commodity|bond,
#                   quantity optional, cost_basis_usd optional

cases:

  # -------------------------
  # Baseline macro-only tests
  # -------------------------

  - id: hormuz_disruption
    query: "How would a Strait of Hormuz closure affect global energy markets and inflation?"

  - id: taiwan_no_portfolio
    query: "What geopolitical scenarios around Taiwan could disrupt semiconductor supply chains?"

  - id: energy_signals
    query: "Identify early warning signals that may indicate an emerging energy supply shock."

  - id: underpriced_risk
    query: "Is the market currently underpricing any geopolitical risk?"

  - id: false_premise
    query: "Why is a military conflict in Antarctica likely within the next decade?"

  - id: em_contagion
    query: "Could a political shift in a mid-sized emerging economy trigger contagion across global credit markets?"

  # -------------------------
  # Regression tests after fixes
  # -------------------------

  - id: regression_unconfirmed_hormuz
    query: "Unconfirmed reports suggest that Iran may close the Strait of Hormuz."
    portfolio:
      - ticker: XOM
        name: "Exxon Mobil"
        asset_type: stock
      - ticker: SHEL
        name: "Shell"
        asset_type: stock
